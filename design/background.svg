<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="halo-depth-base" x1="0" y1="0" x2="1" y2=".8">
      <stop stop-color="#173659"/><stop offset=".45" stop-color="#112e58"/><stop offset="1" stop-color="#0a2144"/>
    </linearGradient>
    <linearGradient id="halo-depth-volume" gradientUnits="userSpaceOnUse" x1="80" y1="110" x2="820" y2="920">
      <stop stop-color="#335a77" stop-opacity=".1"/><stop offset=".27" stop-color="#477a9e" stop-opacity=".56"/><stop offset=".58" stop-color="#325c8a" stop-opacity=".7"/><stop offset=".78" stop-color="#234d83" stop-opacity=".45"/><stop offset="1" stop-color="#234d83" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="halo-depth-submerged" gradientUnits="userSpaceOnUse" x1="30" y1="940" x2="780" y2="520">
      <stop stop-color="#285290" stop-opacity=".65"/><stop offset=".34" stop-color="#315f95" stop-opacity=".62"/><stop offset=".68" stop-color="#2d5b84" stop-opacity=".24"/><stop offset="1" stop-color="#254876" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-depth-shadow">
      <stop offset=".1" stop-color="#071b39" stop-opacity=".65"/><stop offset=".6" stop-color="#071b39" stop-opacity=".4"/><stop offset="1" stop-color="#071b39" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="halo-depth-shade" x1="0" y1=".9" x2="1" y2=".1">
      <stop offset=".3" stop-color="#061a36" stop-opacity="0"/><stop offset="1" stop-color="#061a36" stop-opacity=".55"/>
    </linearGradient>
    <filter id="halo-depth-volume-soft" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".0035 .005" numOctaves="2" seed="7" result="field"/>
      <feDisplacementMap in="SourceGraphic" in2="field" scale="190" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="43"/>
    </filter>
    <filter id="halo-depth-light-soft" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .004" numOctaves="2" seed="19" result="field"/>
      <feDisplacementMap in="SourceGraphic" in2="field" scale="144" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="halo-depth-shadow-soft" color-interpolation-filters="sRGB" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#halo-depth-base)"/>
  <path d="M-260 136C26 68 224 174 394 282C604 418 584 624 832 666C1042 702 1156 864 1208 1160H-260Z" fill="url(#halo-depth-volume)" filter="url(#halo-depth-volume-soft)"/>
