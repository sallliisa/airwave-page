  <body class="landing-page">
    <div class="ambience" aria-hidden="true">
      <svg class="airwave-background" viewBox="0 0 1600 1000" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="halo-depth-base" x1="0" y1="0" x2="1" y2=".8">
          <stop stop-color="#173659"/><stop offset=".45" stop-color="#112e58"/><stop offset="1" stop-color="#0a2144"/>
        </linearGradient>
        <linearGradient id="halo-depth-volume" gradientUnits="userSpaceOnUse" x1="80" y1="110" x2="820" y2="920">
          <stop stop-color="#335a77" stop-opacity=".1"/><stop offset=".27" stop-color="#477a9e" stop-opacity=".56"/><stop offset=".58" stop-color="#325c8a" stop-opacity=".7"/><stop offset=".78" stop-color="#234d83" stop-opacity=".45"/><stop offset="1" stop-color="#234d83" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="halo-depth-submerged" gradientUnits="userSpaceOnUse" x1="30" y1="940" x2="780" y2="520">
          <stop stop-color="#285290" stop-opacity=".65"/><stop offset=".34" stop-color="#315f95" stop-opacity=".62"/><stop offset=".68" stop-color="#2d5b84" stop-opacity=".24"/><stop offset="1" stop-color="#254876" stop-opacity="0"/>

        <radialGradient id="halo-depth-shadow">
          <stop offset=".1" stop-color="#071b39" stop-opacity=".65"/><stop offset=".6" stop-color="#071b39" stop-opacity=".4"/><stop offset="1" stop-color="#071b39" stop-opacity="0"/>

          <stop offset=".3" stop-color="#061a36" stop-opacity="0"/><stop offset="1" stop-color="#061a36" stop-opacity=".55"/>
        </linearGradient>
        <filter id="halo-depth-volume-soft" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".0035 .005" numOctaves="2" seed="7" result="field"/>
          <feDisplacementMap in="SourceGraphic" in2="field" scale="190" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="43"/>
        </filter>
        <filter id="halo-depth-light-soft" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".006 .004" numOctaves="2" seed="19" result="field"/>
          <feDisplacementMap in="SourceGraphic" in2="field" scale="144" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="36"/>
        </filter>
        <filter id="halo-depth-shadow-soft" color-interpolation-filters="sRGB" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="38"/></filter>
      </defs>

      <path d="M592 212C776 140 1046 260 1080 450C1114 638 1012 796 846 800C676 806 570 688 584 524C598 378 462 290 592 212Z" fill="url(#halo-depth-shadow)" filter="url(#halo-depth-shadow-soft)"><animate attributeName="d" dur="86s" repeatCount="indefinite" values="M592 212C776 140 1046 260 1080 450C1114 638 1012 796 846 800C676 806 570 688 584 524C598 378 462 290 592 212Z;M620 230C804 158 1072 278 1100 476C1130 664 1038 818 872 822C702 830 590 710 610 548C624 402 490 308 620 230Z;M592 212C776 140 1046 260 1080 450C1114 638 1012 796 846 800C676 806 570 688 584 524C598 378 462 290 592 212Z" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/></path>
      <rect width="1600" height="1000" fill="url(#halo-depth-shade)"/>

    <defs>
      <linearGradient id="halo-depth-halo-body" gradientUnits="userSpaceOnUse" x1="650" y1="-100" x2="-180" y2="760">
        <stop stop-color="#345975" stop-opacity=".08"/><stop offset=".25" stop-color="#436c8c" stop-opacity=".36"/><stop offset=".55" stop-color="#4c7794" stop-opacity=".58"/><stop offset=".8" stop-color="#3d678b" stop-opacity=".3"/><stop offset="1" stop-color="#345975" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="halo-depth-halo-light" gradientUnits="userSpaceOnUse" x1="650" y1="-100" x2="-180" y2="760">
        <stop stop-color="#7598a9" stop-opacity="0"/><stop offset=".2" stop-color="#7598a9" stop-opacity=".16"/><stop offset=".52" stop-color="#7598a9" stop-opacity=".58"/><stop offset=".78" stop-color="#63899f" stop-opacity=".22"/><stop offset="1" stop-color="#63899f" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="halo-depth-halo-shadow" gradientUnits="userSpaceOnUse" x1="650" y1="-100" x2="-180" y2="760">
        <stop stop-color="#071e3e" stop-opacity="0"/><stop offset=".3" stop-color="#071e3e" stop-opacity=".2"/><stop offset=".65" stop-color="#071e3e" stop-opacity=".32"/><stop offset="1" stop-color="#071e3e" stop-opacity="0"/>
      </linearGradient>
      <filter id="halo-depth-halo-soft" color-interpolation-filters="sRGB" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="28"/></filter>
      <filter id="halo-depth-halo-rim" color-interpolation-filters="sRGB" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="12"/></filter>

      <path d="M590-190C750 70 540 340 310 490C90 630-140 710-320 770" stroke="url(#halo-depth-halo-body)" stroke-width="118" filter="url(#halo-depth-halo-soft)"><animate attributeName="d" dur="86s" repeatCount="indefinite" values="M590-190C750 70 540 340 310 490C90 630-140 710-320 770;M610-180C770 94 568 360 335 512C110 650-118 728-300 786;M590-190C750 70 540 340 310 490C90 630-140 710-320 770" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/></path>
      <path d="M590-190C750 70 540 340 310 490C90 630-140 710-320 770" transform="translate(-11 -5)" stroke="url(#halo-depth-halo-light)" stroke-width="28" filter="url(#halo-depth-halo-rim)"><animate attributeName="d" dur="86s" repeatCount="indefinite" values="M590-190C750 70 540 340 310 490C90 630-140 710-320 770;M610-180C770 94 568 360 335 512C110 650-118 728-300 786;M590-190C750 70 540 340 310 490C90 630-140 710-320 770" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/></path>
    </g>
  </svg>
      <div class="grain"></div>
    </div>

    <div class="page">
      <header class="header">
        <img class="brand-symbol" src="assets/airwave-mark.svg" width="40" height="40" alt="Airwave">
        <nav class="navigation" aria-label="Airwave links">
          <a href="https://github.com/sallliisa/Airwave">GitHub</a>
          <a href="https://github.com/sallliisa/Airwave/issues">Support</a>
        </nav>
      </header>

      <main class="main">
        <div class="intro">
          <p class="description">System-wide spatial audio<br>for your Mac's headphones.</p>
          <a class="download" href="https://github.com/sallliisa/Airwave/releases/latest">
            <span>Download for Mac</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M10 3v12m-5-5 5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <p class="requirement">macOS 15 or later</p>
          <button class="brew-install" type="button" aria-label="Copy Homebrew install command">
            <code id="brew-command"><span>brew install --cask</span> <span>sallliisa/airwave/airwave</span></code>
            <svg class="copy-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <rect x="7" y="7" width="9" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M12 4H5a1 1 0 0 0-1 1v8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <svg class="copied-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="m4 10 4 4 8-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <p class="visually-hidden" id="brew-status" role="status" aria-live="polite"></p>
        </div>
        <h1 class="wordmark">Airwave</h1>
      </main>
    </div>
