<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Airwave - Spatial audio for Mac</title>
    <meta name="description" content="System-wide spatial audio for your Mac's headphones. Download Airwave for macOS 15 or later.">
    <meta name="theme-color" content="#0a214b">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Airwave - Spatial audio for Mac">
    <meta property="og:description" content="System-wide spatial audio for your Mac's headphones. Download Airwave for macOS 15 or later.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Airwave - Spatial audio for Mac">
    <meta name="twitter:description" content="System-wide spatial audio for your Mac's headphones.">
    <link rel="icon" href="assets/airwave-mark.svg" type="image/svg+xml">
    <link rel="preload" href="assets/instrument-serif.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script src="site.js" defer></script>
  </head>
  <body>
    <picture class="ambience" aria-hidden="true">
      <source media="(max-width: 640px)" srcset="assets/background-phone.webp">
      <img class="airwave-background" src="assets/background-desktop.webp" alt="" fetchpriority="high">
    </picture>

    <div class="page">
      <header class="header">
        <img class="brand-symbol" src="assets/airwave-mark.svg" width="40" height="40" alt="Airwave">
        <nav class="navigation" aria-label="Airwave links">
          <a href="https://github.com/sallliisa/Airwave">GitHub</a>
          <a href="https://github.com/sallliisa/Airwave/issues">Support</a>
        </nav>
      </header>

      <main class="main">
        <div class="intro">
          <p class="description">System-wide spatial audio<br>for your Mac's headphones.</p>
          <p class="requirement">macOS 15 or later</p>
          <div class="installation" role="group" aria-label="Installation options">
            <a class="download" href="https://github.com/sallliisa/Airwave/releases/latest">
              <span>Download for Mac</span>
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M10 3v12m-5-5 5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
            <p class="brew-label">or use Homebrew</p>
            <button class="brew-install" type="button" aria-label="Copy Homebrew install command">
              <code id="brew-command"><span>brew install --cask</span> <span>sallliisa/airwave/airwave</span></code>
              <svg class="copy-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <rect x="7" y="7" width="9" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M12 4H5a1 1 0 0 0-1 1v8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              <svg class="copied-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="m4 10 4 4 8-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <p class="visually-hidden" id="brew-status" role="status" aria-live="polite"></p>
          </div>
        </div>
        <h1 class="wordmark">Airwave</h1>
      </main>
    </div>
  </body>
</html>
